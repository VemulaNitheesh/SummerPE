---
- name: Build and run the medicine ecommerce prototype
  hosts: local
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}/.."
  tasks:
    - name: Verify Docker is available
      ansible.builtin.command:
        argv: [docker, --version]
      changed_when: false
    - name: Verify Docker Compose is available
      ansible.builtin.command:
        argv: [docker-compose, --version]
      changed_when: false
    - name: Package product service
      ansible.builtin.command:
        argv: [mvn, -q, -DskipTests, package]
        chdir: "{{ project_dir }}/product-service"
      changed_when: true
    - name: Package inventory service
      ansible.builtin.command:
        argv: [mvn, -q, -DskipTests, package]
        chdir: "{{ project_dir }}/inventory-service"
      changed_when: true
    - name: Package order service
      ansible.builtin.command:
        argv: [mvn, -q, -DskipTests, package]
        chdir: "{{ project_dir }}/order-service"
      changed_when: true
    - name: Build current service images
      ansible.builtin.command:
        argv: [docker-compose, -f, docker-compose.yml, build, product-service, inventory-service, order-service]
        chdir: "{{ project_dir }}"
      changed_when: true
    - name: Start the prototype stack
      ansible.builtin.command:
        argv: [docker-compose, -f, docker-compose.yml, up, -d]
        chdir: "{{ project_dir }}"
      changed_when: true
    - name: Wait for product-service health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8081/actuator/health
        status_code: 200
        return_content: true
      register: product_health
      until: product_health.json.status == 'UP'
      retries: 24
      delay: 5
    - name: Wait for inventory-service health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8082/actuator/health
        status_code: 200
        return_content: true
      register: inventory_health
      until: inventory_health.json.status == 'UP'
      retries: 24
      delay: 5
    - name: Confirm nginx routes inventory traffic
      ansible.builtin.uri:
        url: http://127.0.0.1:8090/api/v1/inventories
        status_code: 200
      register: nginx_inventory
      until: nginx_inventory.status == 200
      retries: 12
      delay: 3
    - name: Wait for order-service health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8083/actuator/health
        status_code: 200
        return_content: true
      register: order_health
      until: order_health.json.status == 'UP'
      retries: 24
      delay: 5
    - name: Report deployed endpoints
      ansible.builtin.debug:
        msg:
          - "Product service: http://localhost:8081"
          - "Inventory service: http://localhost:8082"
          - "Order service: http://localhost:8083"
          - "Nginx gateway: http://localhost:8090"
