---
- name: Blue-Green Traffic Switch Only (role-based, with automatic rollback)
  hosts: local
  gather_facts: false

  vars_files:
    - vars/thresholds.yml

  vars:
    project_dir: "{{ playbook_dir }}/.."

  tasks:

    - name: Detect active and target environment
      ansible.builtin.include_role:
        name: detect_environment

    - block:

        - name: Verify {{ target_environment }} is healthy before switching
          ansible.builtin.include_role:
            name: health_check
          vars:
            check_environment: "{{ target_environment }}"

        - name: Switch public traffic to {{ target_environment }}
          ansible.builtin.include_role:
            name: switch_traffic

        - name: Drain requests from {{ active_environment }} (previous colour)
          ansible.builtin.include_role:
            name: drain_requests
          vars:
            drain_environment: "{{ active_environment }}"

        - name: Stop {{ active_environment | capitalize }} stack
          ansible.builtin.command:
            argv:
              - docker-compose
              - -p
              - "{{ active_environment }}"
              - -f
              - "docker-compose-{{ active_environment }}.yml"
              - down
            chdir: "{{ project_dir }}"
          changed_when: true

        - name: Switch completed
          ansible.builtin.debug:
            msg:
              - "Traffic switched successfully to {{ target_environment | capitalize }}."
              - "Old environment stopped."

      rescue:

        - name: Switch failed - triggering automatic rollback
          ansible.builtin.debug:
            msg: >-
              Switch to {{ target_environment }} failed
              ({{ ansible_failed_task.name | default('unknown step') }}).
              Rolling traffic back to {{ active_environment }}.

        - name: Roll back to {{ active_environment }}
          ansible.builtin.include_role:
            name: rollback
          vars:
            rollback_to_environment: "{{ active_environment }}"
            failed_environment: "{{ target_environment }}"

        - name: Fail the play after rollback
          ansible.builtin.fail:
            msg: >-
              Traffic switch aborted and rolled back to {{ active_environment }}.
              Check evaluation/rollback_results.txt for the rollback record.
