---
- name: Blue-Green Deployment (role-based, with automatic rollback)
  hosts: local
  gather_facts: false

  vars_files:
    - vars/thresholds.yml

  vars:
    project_dir: "{{ playbook_dir }}/.."

  tasks:

    ####################################################################
    # Prerequisites
    ####################################################################

    - name: Create evaluation directory
      ansible.builtin.file:
        path: "{{ project_dir }}/evaluation"
        state: directory
        mode: "0755"

    - name: Verify Docker is available
      ansible.builtin.command:
        argv:
          - docker
          - --version
      changed_when: false

    - name: Verify Docker Compose is available
      ansible.builtin.command:
        argv:
          - docker-compose
          - --version
      changed_when: false

    ####################################################################
    # Detect active / target colour
    ####################################################################

    - name: Detect active and target environment
      ansible.builtin.include_role:
        name: detect_environment

    ####################################################################
    # Deploy, with automatic rollback if anything in the block fails
    ####################################################################

    - block:

        - name: Package services and build {{ target_environment }} images
          ansible.builtin.include_role:
            name: build_images

        - name: Start infrastructure and {{ target_environment }} stack
          ansible.builtin.include_role:
            name: start_stack

        - name: Wait for {{ target_environment }} environment to become healthy
          ansible.builtin.include_role:
            name: health_check
          vars:
            check_environment: "{{ target_environment }}"

        - name: Switch public traffic to {{ target_environment }}
          ansible.builtin.include_role:
            name: switch_traffic

        - name: Drain requests from {{ active_environment }} (previous colour)
          ansible.builtin.include_role:
            name: drain_requests
          vars:
            drain_environment: "{{ active_environment }}"

        - name: Stop {{ active_environment | capitalize }} stack
          ansible.builtin.command:
            argv:
              - docker-compose
              - -p
              - "{{ active_environment }}"
              - -f
              - "docker-compose-{{ active_environment }}.yml"
              - down
            chdir: "{{ project_dir }}"
          changed_when: true

        - name: Save traffic switch evaluation
          ansible.builtin.copy:
            dest: "{{ project_dir }}/evaluation/traffic_switch_results.txt"
            content: |
              =========================================
              Blue-Green Traffic Switch Evaluation
              =========================================

              Active Environment : {{ active_environment }}
              Target Environment : {{ target_environment }}

              Traffic Switch Time : {{ switch_duration }} ms

              =========================================

        - name: Deployment completed
          ansible.builtin.debug:
            msg:
              - "Deployment completed successfully."
              - "Active Environment : {{ target_environment }}"
              - "Old environment stopped."

      rescue:

        - name: Deployment failed - triggering automatic rollback
          ansible.builtin.debug:
            msg: >-
              Deployment to {{ target_environment }} failed
              ({{ ansible_failed_task.name | default('unknown step') }}).
              Rolling traffic back to {{ active_environment }}.

        - name: Roll back to {{ active_environment }}
          ansible.builtin.include_role:
            name: rollback
          vars:
            rollback_to_environment: "{{ active_environment }}"
            failed_environment: "{{ target_environment }}"

        - name: Fail the play after rollback
          ansible.builtin.fail:
            msg: >-
              Deployment aborted and rolled back to {{ active_environment }}.
              {{ target_environment }} was left stopped. Check the debug
              output above for the failing step, and
              evaluation/rollback_results.txt for the rollback record.
