services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    networks:
      - medicine-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  product-service:
    image: product-service:latest

    build:
      context: ./product-service

    container_name: product-service-container
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${PRODUCT_DB}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PRODUCT_PORT}:8081"

    networks:
      - medicine-network

  inventory-service:
    image: inventory-service:latest

    build:
      context: ./inventory-service

    container_name: inventory-service-container
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${INVENTORY_DB}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8081

    ports:
      - "${INVENTORY_PORT}:8082"

    networks:
      - medicine-network
  order-service:
    image: order-service:latest

    build:
      context: ./order-service

    container_name: order-service-container
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${ORDER_DB}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082

    ports:
      - "${ORDER_PORT}:8083"

    networks:
      - medicine-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    depends_on:
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started

    ports:
      - "8090:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - medicine-network
volumes:
  mysql-data:

networks:
  medicine-network:
