services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - medicine-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    ports:
      - "8090:80"

    volumes:
      - ./nginx:/etc/nginx:ro

    networks:
      - medicine-network

volumes:
  mysql-data:

networks:
  medicine-network:
    external: true
