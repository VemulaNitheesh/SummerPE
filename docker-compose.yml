services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

    networks:
      - medicine-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  product-service-v1:
    image: product-service:v1

    container_name: product-service-v1
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${PRODUCT_DB}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: v1
    ports:
      - "${PRODUCT_PORT}:8081"

    networks:
      - medicine-network
  product-service-v2:
    image: product-service:v2
    
    build:
      context: ./product-service

    container_name: product-service-v2
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${PRODUCT_DB}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: v2
    ports:
      - "8083:8081"

    networks:
      - medicine-network

  inventory-service:
    image: inventory-service:latest

    build:
      context: ./inventory-service

    container_name: inventory-service-container
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${INVENTORY_DB}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://nginx

    ports:
      - "${INVENTORY_PORT}:8082"

    networks:
      - medicine-network
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    depends_on:
      product-service-v1:
        condition: service_started
      inventory-service:
        condition: service_started
      product-service-v2:
        condition: service_started

    ports:
      - "8090:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - medicine-network
volumes:
  mysql-data:

networks:
  medicine-network:
