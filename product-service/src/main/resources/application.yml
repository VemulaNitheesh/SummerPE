spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fail fast (5s) instead of HikariCP's 30s default if the pool is ever
      # actually exhausted, so problems surface as clear errors, not silent
      # multi-second stalls.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
